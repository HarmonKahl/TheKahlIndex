<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Kahl Index | NCAA Softball Ratings & Bracketology</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --highlight: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
            font-size: 2.2rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Bracketology Grid Styling */
        .regionals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .regional-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .regional-header {
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .regional-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .team-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .team-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            margin-bottom: 4px;
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .seed-num {
            font-weight: 700;
            color: var(--text-muted);
            width: 35px;
        }

        .team-name {
            flex-grow: 1;
            font-weight: 500;
        }

        /* Table Styling for Rankings */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--accent-color);
            font-weight: 600;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>The Kahl Index</h1>
        <div class="subtitle">NCAA Softball Ratings & Daily Projected Bracketology</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'rankings')">Kahl Index Rankings</button>
        <button class="tab-btn" onclick="switchTab(event, 'conferences')">Conference Rankings</button>
        <button class="tab-btn" onclick="switchTab(event, 'bracketology')">Bracketology (64-Team)</button>
    </div>

    <!-- Overall Rankings Tab (Default Active) -->
    <div id="rankings" class="tab-content active">
        <div id="rankings-loading" class="loading">Loading Kahl Index Rankings...</div>
        <table id="rankings-table" style="display:none;">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Team</th>
                    <th>Conference</th>
                    <th>Rating</th>
                </tr>
            </thead>
            <tbody id="rankings-body"></tbody>
        </table>
    </div>

    <!-- Conference Rankings Tab -->
    <div id="conferences" class="tab-content">
        <div id="conferences-loading" class="loading">Loading Conference Rankings...</div>
        <table id="conferences-table" style="display:none;">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Conference</th>
                    <th>Average Rating</th>
                    <th>Teams</th>
                </tr>
            </thead>
            <tbody id="conferences-body"></tbody>
        </table>
    </div>

    <!-- Bracketology Tab -->
    <div id="bracketology" class="tab-content">
        <div id="bracket-loading" class="loading">Loading Bracketology Projection...</div>
        <div id="bracket-container" class="regionals-grid"></div>
    </div>
</div>

<script>
    let cachedRatingsData = null;

    // Tab Switcher
    function switchTab(evt, tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        if (evt && evt.currentTarget) {
            evt.currentTarget.classList.add('active');
        }
    }

    // Load Overall Ratings
    async function loadRankings() {
        const loadingEl = document.getElementById('rankings-loading');
        const tableEl = document.getElementById('rankings-table');
        const tbodyEl = document.getElementById('rankings-body');

        try {
            const response = await fetch(`ratings.json?v=${Date.now()}`);
            if (!response.ok) throw new Error('HTTP ' + response.status);

            const ratings = await response.json();
            cachedRatingsData = Array.isArray(ratings) ? ratings : (ratings.teams || ratings.data || []);

            loadingEl.style.display = 'none';
            tableEl.style.display = 'table';
            tbodyEl.innerHTML = '';

            cachedRatingsData.forEach((team, index) => {
                const row = document.createElement('tr');
                const name = typeof team === 'string' ? team : (team.Team || team.team || team.name || 'N/A');
                const conf = typeof team === 'object' ? (team.Conference || team.conference || team.conf || 'N/A') : 'N/A';
                
                let rawRating = typeof team === 'object' ? (team.Rating ?? team.rating ?? team.score) : team;
                let ratingVal = typeof rawRating === 'number' ? rawRating.toFixed(2) : (rawRating || 'N/A');

                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${name}</strong></td>
                    <td>${conf}</td>
                    <td>${ratingVal}</td>
                `;
                tbodyEl.appendChild(row);
            });

            // Calculate & render Conference Rankings once team ratings are loaded
            renderConferenceRankings(cachedRatingsData);

        } catch (err) {
            console.error('Rankings Fetch Error:', err);
            loadingEl.innerHTML = `<p style="color: #ef4444;">Unable to load ratings data (${err.message}).</p>`;
        }
    }

    // Render Conference Rankings dynamically
    function renderConferenceRankings(teamList) {
        const loadingEl = document.getElementById('conferences-loading');
        const tableEl = document.getElementById('conferences-table');
        const tbodyEl = document.getElementById('conferences-body');

        const confMap = {};

        teamList.forEach(team => {
            const conf = typeof team === 'object' ? (team.Conference || team.conference || team.conf) : null;
            let rawRating = typeof team === 'object' ? (team.Rating ?? team.rating ?? team.score) : null;

            if (conf && typeof rawRating === 'number') {
                if (!confMap[conf]) {
                    confMap[conf] = { total: 0, count: 0 };
                }
                confMap[conf].total += rawRating;
                confMap[conf].count += 1;
            }
        });

        const confList = Object.keys(confMap).map(conf => ({
            name: conf,
            avgRating: confMap[conf].total / confMap[conf].count,
            count: confMap[conf].count
        })).sort((a, b) => b.avgRating - a.avgRating);

        loadingEl.style.display = 'none';
        tableEl.style.display = 'table';
        tbodyEl.innerHTML = '';

        confList.forEach((conf, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td><strong>${conf.name}</strong></td>
                <td>${conf.avgRating.toFixed(2)}</td>
                <td>${conf.count}</td>
            `;
            tbodyEl.appendChild(row);
        });
    }

    // Load Bracketology Data (Conferences Omitted)
    async function loadBracketology() {
        const loadingEl = document.getElementById('bracket-loading');
        const containerEl = document.getElementById('bracket-container');

        try {
            const response = await fetch(`bracketology.json?v=${Date.now()}`);
            if (!response.ok) throw new Error('HTTP ' + response.status);
            
            const data = await response.json();
            loadingEl.style.display = 'none';

            const regionals = Array.isArray(data) ? data : (data.regionals || data.bracket || []);

            regionals.forEach((regional, index) => {
                const card = document.createElement('div');
                card.className = 'regional-card';

                let teamsHTML = '';
                const teams = regional.teams || regional.seeds || [];

                teams.forEach((team, idx) => {
                    const teamName = typeof team === 'string' ? team : (team.Team || team.team || team.name || 'TBD');
                    const seed = typeof team === 'object' && team.seed ? team.seed : (idx + 1);

                    teamsHTML += `
                        <li class="team-item">
                            <span class="seed-num">#${seed}</span>
                            <span class="team-name">${teamName}</span>
                        </li>
                    `;
                });

                card.innerHTML = `
                    <div class="regional-header">
                        <span class="regional-title">${regional.name || regional.regional || 'Regional ' + (index + 1)}</span>
                    </div>
                    <ul class="team-list">
                        ${teamsHTML}
                    </ul>
                `;

                containerEl.appendChild(card);
            });
        } catch (err) {
            console.error('Bracketology Fetch Error:', err);
            loadingEl.innerHTML = `<p style="color: #ef4444;">Unable to load bracketology projection (${err.message}).</p>`;
        }
    }

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
        loadRankings();
        loadBracketology();
    });
</script>

</body>
</html>
