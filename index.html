<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Kahl Index | NCAA Softball Power Rankings</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --green-bg: rgba(34, 197, 94, 0.15);
      --green-text: #4ade80;
      --red-bg: rgba(239, 68, 68, 0.15);
      --red-text: #f87171;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-size: 1rem;
    }

    /* Tab Navigation */
    .tab-navigation {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      color: var(--text-main);
      border-color: var(--accent-blue);
    }
    .tab-btn.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: var(--accent-blue);
    }

    /* Tab Content Display */
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* Top 3 Podium Cards */
    .top-three {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }
    .podium-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .podium-card.rank-1 { border-color: #eab308; }
    .podium-card.rank-2 { border-color: #94a3b8; }
    .podium-card.rank-3 { border-color: #b45309; }

    .podium-badge {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    .podium-team {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 0.25rem;
      margin-bottom: 0.15rem;
    }
    .podium-conf {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    .podium-raa {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent-blue);
    }

    /* Controls Bar */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .search-input {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
      max-width: 320px;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent-blue);
    }

    /* Table Design */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }
    th, td {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }
    th {
      background: rgba(15, 23, 42, 0.6);
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }
    tbody tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Badges */
    .raa-badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.875rem;
    }
    .raa-positive {
      background: var(--green-bg);
      color: var(--green-text);
    }
    .raa-negative {
      background: var(--red-bg);
      color: var(--red-text);
    }

    .record-text {
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>THE KAHL INDEX</h1>
    <p>NCAA Division I Softball Power Rankings (Runs Above Average)</p>
  </header>

  <!-- Navigation Tabs -->
  <div class="tab-navigation">
    <button class="tab-btn active" onclick="switchTab('teamsTab', this)">Team Rankings</button>
    <button class="tab-btn" onclick="switchTab('conferencesTab', this)">Conference Rankings</button>
  </div>

  <!-- TAB 1: TEAM RANKINGS -->
  <div id="teamsTab" class="tab-content active">
    <div class="top-three" id="topThree"></div>
    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search team or conference..." onkeyup="filterTable()" />
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Team</th>
            <th>Conference</th>
            <th>RAA</th>
            <th>Record</th>
            <th>Runs/7</th>
            <th>RA/7</th>
            <th>SoS</th>
          </tr>
        </thead>
        <tbody id="rankingsBody">
          <tr>
            <td colspan="8" style="text-align: center; color: var(--text-muted);">Loading ratings...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- TAB 2: CONFERENCE RANKINGS -->
  <div id="conferencesTab" class="tab-content">
    <div class="controls">
      <input type="text" id="confSearchInput" class="search-input" placeholder="Search conference..." onkeyup="filterConfTable()" />
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Conference</th>
            <th>Avg RAA</th>
            <th>Teams</th>
            <th>Top 25 Teams</th>
            <th>Top Ranked Team</th>
          </tr>
        </thead>
        <tbody id="confRankingsBody">
          <tr>
            <td colspan="6" style="text-align: center; color: var(--text-muted);">Loading conference ratings...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    var rawRatings = [];
    var conferenceRatings = [];

    function numFix(val) {
      var n = Number(val);
      return isNaN(n) ? '0.00' : n.toFixed(2);
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    async function loadRatings() {
      var tbody = document.getElementById('rankingsBody');
      if (!tbody) return;

      try {
        var response = await fetch('./ratings.json?v=' + new Date().getTime());
        
        if (!response.ok) {
          throw new Error('HTTP status ' + response.status + ' (' + response.statusText + ')');
        }

        rawRatings = await response.json();

        if (!rawRatings || !Array.isArray(rawRatings) || rawRatings.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--text-muted);">' +
            'ratings.json is empty or invalid. Run compute_ratings.py to populate data.</td></tr>';
          return;
        }

        renderTopThree(rawRatings.slice(0, 3));
        renderTable(rawRatings);
        computeAndRenderConferences(rawRatings);
      } catch (error) {
        console.error('Error loading ratings.json:', error);
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--red-text);">' +
          'Could not load ratings.json: ' + error.message + '</td></tr>';
      }
    }

    function renderTopThree(top3) {
      var container = document.getElementById('topThree');
      if (!container || !top3 || top3.length === 0) return;

      var classes = ['rank-1', 'rank-2', 'rank-3'];
      var labels = ['#1 Ranked', '#2 Ranked', '#3 Ranked'];
      var html = '';

      for (var i = 0; i < top3.length; i++) {
        var team = top3[i];
        var raaVal = Number(team.raa) || 0;
        var sosVal = Number(team.sos) || 0;
        var raaPrefix = raaVal > 0 ? '+' : '';
        var sosPrefix = sosVal > 0 ? '+' : '';
        var wins = team.wins !== undefined ? team.wins : '-';
        var losses = team.losses !== undefined ? team.losses : '-';
        var conf = team.conference || 'Independent / Other';

        html += '<div class="podium-card ' + classes[i] + '">' +
                  '<div class="podium-badge">' + labels[i] + '</div>' +
                  '<div class="podium-team">' + (team.team || 'Unknown') + '</div>' +
                  '<div class="podium-conf">' + conf + '</div>' +
                  '<div class="podium-raa">' + raaPrefix + numFix(raaVal) + '</div>' +
                  '<div class="record-text" style="margin-top:0.4rem;">' + wins + '-' + losses + ' | SoS: ' + sosPrefix + numFix(sosVal) + '</div>' +
                '</div>';
      }

      container.innerHTML = html;
    }

    function renderTable(data) {
      var tbody = document.getElementById('rankingsBody');
      if (!tbody) return;

      var html = '';

      for (var i = 0; i < data.length; i++) {
        var row = data[i];
        var raaVal = Number(row.raa) || 0;
        var sosVal = Number(row.sos) || 0;
        var raaClass = raaVal >= 0 ? 'raa-positive' : 'raa-negative';
        var raaFormatted = (raaVal > 0 ? '+' : '') + numFix(raaVal);
        var sosFormatted = (sosVal > 0 ? '+' : '') + numFix(sosVal);
        var wins = row.wins !== undefined ? row.wins : '-';
        var losses = row.losses !== undefined ? row.losses : '-';
        var conf = row.conference || 'Independent / Other';

        html += '<tr>' +
                  '<td style="font-weight: 700; color: var(--text-muted);">#' + (row.rank || (i + 1)) + '</td>' +
                  '<td style="font-weight: 600;">' + (row.team || 'Unknown') + '</td>' +
                  '<td style="color: var(--text-muted); font-size: 0.85rem;">' + conf + '</td>' +
                  '<td><span class="raa-badge ' + raaClass + '">' + raaFormatted + '</span></td>' +
                  '<td>' + wins + '-' + losses + '</td>' +
                  '<td>' + numFix(row.r_per_7) + '</td>' +
                  '<td>' + numFix(row.ra_per_7) + '</td>' +
                  '<td style="color: var(--text-muted);">' + sosFormatted + '</td>' +
                '</tr>';
      }

      tbody.innerHTML = html;
    }

    function computeAndRenderConferences(data) {
      var groups = {};

      data.forEach(function(item) {
        var conf = item.conference || 'Independent / Other';
        if (conf === 'Independent / Other') return;

        if (!groups[conf]) {
          groups[conf] = {
            name: conf,
            teams: [],
            totalRAA: 0,
            top25Count: 0
          };
        }

        groups[conf].teams.push(item);
        groups[conf].totalRAA += (Number(item.raa) || 0);
        if (item.rank <= 25) {
          groups[conf].top25Count++;
        }
      });

      conferenceRatings = Object.values(groups).map(function(g) {
        g.teams.sort((a, b) => a.rank - b.rank);
        return {
          conference: g.name,
          avgRAA: g.totalRAA / g.teams.length,
          teamCount: g.teams.length,
          top25Count: g.top25Count,
          topTeam: g.teams[0].team,
          topTeamRank: g.teams[0].rank
        };
      });

      // Sort by Average RAA descending
      conferenceRatings.sort((a, b) => b.avgRAA - a.avgRAA);
      
      renderConferenceTable(conferenceRatings);
    }

    function renderConferenceTable(data) {
      var tbody = document.getElementById('confRankingsBody');
      if (!tbody) return;

      var html = '';

      for (var i = 0; i < data.length; i++) {
        var row = data[i];
        var avgRaaVal = Number(row.avgRAA) || 0;
        var raaClass = avgRaaVal >= 0 ? 'raa-positive' : 'raa-negative';
        var raaFormatted = (avgRaaVal > 0 ? '+' : '') + numFix(avgRaaVal);

        html += '<tr>' +
                  '<td style="font-weight: 700; color: var(--text-muted);">#' + (i + 1) + '</td>' +
                  '<td style="font-weight: 600;">' + row.conference + '</td>' +
                  '<td><span class="raa-badge ' + raaClass + '">' + raaFormatted + '</span></td>' +
                  '<td>' + row.teamCount + '</td>' +
                  '<td>' + row.top25Count + '</td>' +
                  '<td>' + row.topTeam + ' <small style="color: var(--text-muted);">(' + '#' + row.topTeamRank + ')' + '</small></td>' +
                '</tr>';
      }

      tbody.innerHTML = html;
    }

    function filterTable() {
      var query = document.getElementById('searchInput').value.toLowerCase();
      var filtered = rawRatings.filter(function(item) {
        var t = (item.team || '').toLowerCase();
        var c = (item.conference || '').toLowerCase();
        return t.includes(query) || c.includes(query);
      });
      renderTable(filtered);
    }

    function filterConfTable() {
      var query = document.getElementById('confSearchInput').value.toLowerCase();
      var filtered = conferenceRatings.filter(function(item) {
        return (item.conference || '').toLowerCase().includes(query);
      });
      renderConferenceTable(filtered);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadRatings);
    } else {
      loadRatings();
    }
  </script>
</body>
</html>
