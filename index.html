<script>
  var rawRatings = [];

  // Map special-case team names directly to exact NCAA API slugs
  var SLUG_OVERRIDES = {
    'ucla': 'ucla',
    'ole miss': 'ole-miss',
    'smu': 'smu',
    'byu': 'byu',
    'lsu': 'lsu',
    'unc': 'north-carolina',
    'penn': 'pennsylvania'
  };

  function getLogoUrl(teamObj) {
    if (!teamObj) return '';
    
    // 1. Use explicit slug from ratings.json if present
    var slug = teamObj.slug;

    // 2. Fallback: generate slug dynamically from team name if slug is missing
    if (!slug && teamObj.team) {
      var cleanName = teamObj.team.toLowerCase().trim();
      
      if (SLUG_OVERRIDES[cleanName]) {
        slug = SLUG_OVERRIDES[cleanName];
      } else {
        slug = cleanName
          .replace(/&/g, '-')
          .replace(/['.]/g, '')
          .replace(/\s+/g, '-')
          .replace(/[^a-z0-9\-]/g, '');
      }
    }

    return slug ? 'https://ncaa-api.henrygd.me/logo/' + slug + '.svg?dark=true' : '';
  }

  async function loadRatings() {
    var tbody = document.getElementById('rankingsBody');
    if (!tbody) return;

    try {
      var response = await fetch('ratings.json');
      if (!response.ok) throw new Error('HTTP ' + response.status);

      rawRatings = await response.json();

      if (!rawRatings || rawRatings.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">ratings.json is empty.</td></tr>';
        return;
      }

      renderTopThree(rawRatings.slice(0, 3));
      renderTable(rawRatings);
    } catch (error) {
      console.error('Error loading ratings:', error);
      tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--red-text);">Could not load ratings.json: ' + error.message + '</td></tr>';
    }
  }

  function renderTopThree(top3) {
    var container = document.getElementById('topThree');
    if (!container || !top3 || top3.length === 0) return;

    var classes = ['rank-1', 'rank-2', 'rank-3'];
    var labels = ['#1 Ranked', '#2 Ranked', '#3 Ranked'];
    var html = '';

    for (var i = 0; i < top3.length; i++) {
      var team = top3[i];
      var raaPrefix = team.raa > 0 ? '+' : '';
      var sosPrefix = team.sos > 0 ? '+' : '';
      var logoUrl = getLogoUrl(team);

      html += '<div class="podium-card ' + classes[i] + '">' +
                '<div class="podium-badge">' + labels[i] + '</div>' +
                '<img class="podium-logo" src="' + logoUrl + '" alt="" onerror="this.style.visibility=\'hidden\'" />' +
                '<div class="podium-team">' + team.team + '</div>' +
                '<div class="podium-raa">' + raaPrefix + team.raa.toFixed(2) + '</div>' +
                '<div class="record-text" style="margin-top:0.4rem;">' + team.wins + '-' + team.losses + ' | SoS: ' + sosPrefix + team.sos.toFixed(2) + '</div>' +
              '</div>';
    }

    container.innerHTML = html;
  }

  function renderTable(data) {
    var tbody = document.getElementById('rankingsBody');
    if (!tbody) return;

    var html = '';

    for (var i = 0; i < data.length; i++) {
      var row = data[i];
      var raaClass = row.raa >= 0 ? 'raa-positive' : 'raa-negative';
      var raaFormatted = (row.raa > 0 ? '+' : '') + row.raa.toFixed(2);
      var sosFormatted = (row.sos > 0 ? '+' : '') + row.sos.toFixed(2);
      var logoUrl = getLogoUrl(row);

      html += '<tr>' +
                '<td style="font-weight: 700; color: var(--text-muted);">#' + row.rank + '</td>' +
                '<td>' +
                  '<div class="team-cell">' +
                    '<img class="table-logo" src="' + logoUrl + '" alt="" onerror="this.style.visibility=\'hidden\'" />' +
                    '<span>' + row.team + '</span>' +
                  '</div>' +
                '</td>' +
                '<td><span class="raa-badge ' + raaClass + '">' + raaFormatted + '</span></td>' +
                '<td>' + row.wins + '-' + row.losses + '</td>' +
                '<td>' + row.r_per_7.toFixed(2) + '</td>' +
                '<td>' + row.ra_per_7.toFixed(2) + '</td>' +
                '<td style="color: var(--text-muted);">' + sosFormatted + '</td>' +
              '</tr>';
    }

    tbody.innerHTML = html;
  }

  function filterTable() {
    var query = document.getElementById('searchInput').value.toLowerCase();
    var filtered = rawRatings.filter(function(item) {
      return item.team.toLowerCase().includes(query);
    });
    renderTable(filtered);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadRatings);
  } else {
    loadRatings();
  }
</script>
