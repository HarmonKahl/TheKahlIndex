<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Kahl Index | NCAA Softball Ratings & Bracketology</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --highlight: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
            font-size: 2.2rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Bracketology Grid */
        .regionals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .regional-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .regional-header {
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .regional-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .team-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .team-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            margin-bottom: 4px;
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .seed-num {
            font-weight: 700;
            color: var(--text-muted);
            width: 35px;
        }

        .team-name {
            flex-grow: 1;
            font-weight: 500;
        }

        /* Rankings Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--accent-color);
            font-weight: 600;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>The Kahl Index</h1>
        <div class="subtitle">NCAA Softball Ratings & Daily Projected Bracketology</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'rankings')">Kahl Index Rankings</button>
        <button class="tab-btn" onclick="switchTab(event, 'conferences')">Conference Rankings</button>
        <button class="tab-btn" onclick="switchTab(event, 'bracketology')">Bracketology (64-Team)</button>
    </div>

    <!-- Overall Rankings Tab (Default Active) -->
    <div id="rankings" class="tab-content active">
        <div id="rankings-loading" class="loading">Loading Kahl Index Rankings...</div>
        <table id="rankings-table" style="display:none;">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Team</th>
                    <th>Conference</th>
                    <th>SOS</th>
                    <th>RAA</th>
                    <th>Rating</th>
                </tr>
            </thead>
            <tbody id="rankings-body"></tbody>
        </table>
    </div>

    <!-- Conference Rankings Tab -->
    <div id="conferences" class="tab-content">
        <div id="conferences-loading" class="loading">Loading Conference Rankings...</div>
        <table id="conferences-table" style="display:none;">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Conference</th>
                    <th>Average Rating</th>
                    <th>Teams</th>
                </tr>
            </thead>
            <tbody id="conferences-body"></tbody>
        </table>
    </div>

    <!-- Bracketology Tab -->
    <div id="bracketology" class="tab-content">
        <div id="bracket-loading" class="loading">Loading Bracketology Projection...</div>
        <div id="bracket-container" class="regionals-grid">
