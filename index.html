<script>
  var rawRatings = [];

  async function loadRatings() {
    var tbody = document.getElementById('rankingsBody');
    try {
      // Use relative path fallback suitable for GitHub Pages subdirectories
      var response = await fetch('ratings.json');
      
      if (!response.ok) {
        throw new Error('HTTP status ' + response.status + ' (' + response.statusText + ')');
      }

      rawRatings = await response.json();

      if (!rawRatings || rawRatings.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">' +
          'ratings.json is currently empty. Run compute_ratings.py to populate data.</td></tr>';
        return;
      }

      renderTopThree(rawRatings.slice(0, 3));
      renderTable(rawRatings);
    } catch (error) {
      console.error('Error loading ratings.json:', error);
      tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--red-text);">' +
        'Could not load ratings.json: ' + error.message + '<br><small style="color: var(--text-muted);">' +
        'Check that ratings.json is committed in the root directory of your repository.</small></td></tr>';
    }
  }

  function renderTopThree(top3) {
    var container = document.getElementById('topThree');
    if (!top3 || top3.length === 0) return;

    var classes = ['rank-1', 'rank-2', 'rank-3'];
    var labels = ['#1 Ranked', '#2 Ranked', '#3 Ranked'];
    var html = '';

    for (var i = 0; i < top3.length; i++) {
      var team = top3[i];
      var raaPrefix = team.raa > 0 ? '+' : '';
      var sosPrefix = team.sos > 0 ? '+' : '';

      html += '<div class="podium-card ' + classes[i] + '">' +
                '<div class="podium-badge">' + labels[i] + '</div>' +
                '<div class="podium-team">' + team.team + '</div>' +
                '<div class="podium-raa">' + raaPrefix + team.raa.toFixed(2) + '</div>' +
                '<div class="record-text" style="margin-top:0.4rem;">' + team.wins + '-' + team.losses + ' | SoS: ' + sosPrefix + team.sos.toFixed(2) + '</div>' +
              '</div>';
    }

    container.innerHTML = html;
  }

  function renderTable(data) {
    var tbody = document.getElementById('rankingsBody');
    var html = '';

    for (var i = 0; i < data.length; i++) {
      var row = data[i];
      var raaClass = row.raa >= 0 ? 'raa-positive' : 'raa-negative';
      var raaFormatted = (row.raa > 0 ? '+' : '') + row.raa.toFixed(2);
      var sosFormatted = (row.sos > 0 ? '+' : '') + row.sos.toFixed(2);

      html += '<tr>' +
                '<td style="font-weight: 700; color: var(--text-muted);">#' + row.rank + '</td>' +
                '<td style="font-weight: 600;">' + row.team + '</td>' +
                '<td><span class="raa-badge ' + raaClass + '">' + raaFormatted + '</span></td>' +
                '<td>' + row.wins + '-' + row.losses + '</td>' +
                '<td>' + row.r_per_7.toFixed(2) + '</td>' +
                '<td>' + row.ra_per_7.toFixed(2) + '</td>' +
                '<td style="color: var(--text-muted);">' + sosFormatted + '</td>' +
              '</tr>';
    }

    tbody.innerHTML = html;
  }

  function filterTable() {
    var query = document.getElementById('searchInput').value.toLowerCase();
    var filtered = rawRatings.filter(function(item) {
      return item.team.toLowerCase().includes(query);
    });
    renderTable(filtered);
  }

  loadRatings();
</script>
