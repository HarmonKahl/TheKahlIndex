import os
import requests
import pandas as pd

# HenryGD NCAA Stats endpoint for Softball D1
STATS_URL = "https://ncaa-api.henrygd.me/stats/softball/d1/current/individual/{category_id}"

# Batting leaderboard category (Default NCAA hitting summary path is '200' or 'individual/200')
# Querying without path returns available category IDs, standard hitting is category 200/148
HITTING_CATEGORY_ID = "200"

def fetch_season_player_stats():
    all_players = []
    page = 1
    
    print("Fetching season-long player stats from NCAA leaderboards...")

    while True:
        url = f"https://ncaa-api.henrygd.me/stats/softball/d1/current/individual/{HITTING_CATEGORY_ID}?page={page}"
        try:
            resp = requests.get(url, timeout=15)
            resp.raise_for_status()
            data = resp.json()
        except Exception as e:
            print(f"Finished or encountered error on page {page}: {e}")
            break

        stats_list = data.get("stats", []) or data.get("data", [])
        if not stats_list:
            break

        for row in stats_list:
            # Handle variable key formats returned by NCAA stats pages
            player_name = row.get("name") or row.get("Player") or row.get("player_name") or "Unknown"
            team = row.get("team") or row.get("Team") or "Unknown"
            
            all_players.append({
                "player_name": player_name,
                "team": team,
                "G": row.get("g") or row.get("G") or 0,
                "AB": row.get("ab") or row.get("AB") or 0,
                "H": row.get("h") or row.get("H") or 0,
                "2B": row.get("d2") or row.get("2b") or row.get("2B") or 0,
                "3B": row.get("d3") or row.get("3b") or row.get("3B") or 0,
                "HR": row.get("hr") or row.get("HR") or 0,
                "BB": row.get("bb") or row.get("BB") or 0
            })

        print(f"Logged page {page} ({len(stats_list)} players)")
        
        # Check total pages if available, otherwise stop when less than standard page size
        total_pages = data.get("pageCount") or data.get("totalPages")
        if total_pages and page >= int(total_pages):
            break
        
        page += 1

    df = pd.DataFrame(all_players)
    df.to_csv("player_boxscores_2026.csv", index=False)
    print(f"Successfully saved {len(df)} total player season stats to player_boxscores_2026.csv!")

if __name__ == "__main__":
    fetch_season_player_stats()
