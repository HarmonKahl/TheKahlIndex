name: Daily Kahl Index Pipeline

on:
  schedule:
    # Runs automatically every day at 06:00 UTC (1:00 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual triggers from the GitHub Actions UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib

      - name: Step 1 - Fetch Team Game Stats & Opponent Data
        run: python pull_season.py

      - name: Step 2 - Fetch Cumulative Player Stats
        run: python pull_cumulative_stats.py

      - name: Step 3 - Calculate RC7 Metrics & Generate Leaderboards
        run: python calculate_rc7.py

      - name: Step 4 - Commit and Push Output Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage output files safely without failing if a file was not generated
          git add players.json qualified_players.json games_season.csv team_games_season.csv cumulative_player_stats.csv 2>/dev/null || true
          
          # Only commit and push if data files were modified
          if git diff --staged --quiet; then
            echo "No changes detected in calculated metrics."
          else
            git commit -m "Auto-update Kahl Index player data [skip ci]"
            git push
          fi
