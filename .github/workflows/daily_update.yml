name: Update Kahl Index Data

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 6 AM UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. R Setup & Script Execution ---
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R Dependencies
        run: |
          Rscript -e 'install.packages(c("tidyverse", "jsonlite", "devtools"))'
          Rscript -e 'devtools::install_github("sportsdataverse/softballR")'

      - name: Run Softball R Script
        run: Rscript calculate_rc7.R

      # --- 2. Commit All Generated Data Files ---
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ratings.json bracketology.json players.json || true
          git status
          git commit -m "Auto-update Kahl Index data" || exit 0
          git push origin main
