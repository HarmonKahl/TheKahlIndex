name: Daily Kahl Index Pipeline

on:
  schedule:
    # Runs automatically every day at 06:00 UTC (1:00 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual triggers from the GitHub Actions UI

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    services:
      ncaa-api:
        image: henrygd/ncaa-api
        ports:
          - 3000:3000

    env:
  NCAA_BOXSCORE_BASE: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib beautifulsoup4 curl_cffi

      - name: Step 1 - Fetch Team Game Stats & Opponent Data
        run: python pull_season.py 2026-02-05 2026-06-10

      - name: Step 2 - Fetch Per-Game Player Stats
        run: python pull_player_stats.py 2026-02-05 2026-06-10

      - name: Step 3 - Calculate RC7 Metrics & Generate Leaderboards
        run: python calculate_rc7.py

      - name: Step 4 - Commit and Push Output Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage output CSVs, JSON leaderboards, cache, and progress checkpoints
          git add games_season.csv team_games_season.csv cumulative_player_stats.csv player_games_season.csv _player_completed_dates.txt boxscore_cache.json players.json qualified_players.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "No changes detected in calculated metrics."
          else
            git commit -m "Auto-update Kahl Index player data and progress checkpoints [skip ci]"
            git push
          fi
