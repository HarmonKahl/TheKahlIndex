name: Update Kahl Index Data

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 6 AM UTC
  workflow_dispatch: # Allows manual triggers from GitHub Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Python Setup ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      # --- 2. Data Extraction & Analytics Pipeline ---
      - name: Run Live NCAA Python Scraper
        run: python pull_season.py 2026-02-05 2026-06-10

      - name: Calculate Player RC7 Metrics
        run: python calculate_rc7.py

      # --- 3. Commit Generated Files back to Repository ---
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ratings.json bracketology.json players.json player_boxscores_2026.csv games_season.csv team_games_season.csv _completed_dates.txt || true
          git status
          git commit -m "Auto-update Kahl Index 2026 data" || exit 0
          git push origin main
