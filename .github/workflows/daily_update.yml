name: 2026 NCAA D-I Softball RC7 Pipeline

on:
  schedule:
    # Runs daily at 6:00 AM UTC (1:00 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Step 1 - Fetch Team Stats & Opponent Data
        run: |
          python pull_season.py 2026-02-05 2026-06-05

      - name: Step 2 - Fetch Player Box Scores & XBH
        run: |
          python pull_player_stats.py

      - name: Step 3 - Calculate RC7 Leaderboards & RAA
        run: |
          python calculate_rc7.py

      - name: Commit and Push Updated Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _completed_dates.txt team_games_season.csv player_games_season.csv players.json qualified_players.json || true
          git commit -m "Auto-update 2026 RC7 Leaderboards & Data [skip ci]" || exit 0
          git push

      - name: Upload Data Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-data-and-leaderboards
          path: |
            team_games_season.csv
            player_games_season.csv
            players.json
            qualified_players.json
            _completed_dates.txt
