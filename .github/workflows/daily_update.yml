name: Update Kahl Index Data

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 6 AM UTC
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Scraper (Game Scores + Player Leaderboard)
        run: python -u pull_season.py 2026-02-05 2026-06-10

      - name: Calculate Player RC7 Metrics
        run: python calculate_rc7.py

      - name: Commit and Push All Data Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add games_season.csv team_games_season.csv _completed_dates.txt player_boxscores_2026.csv players.json ratings.json bracketology.json || true
          git status
          git commit -m "Auto-update Kahl Index games and player stats" || exit 0
          git push origin main
