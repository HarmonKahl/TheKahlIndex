name: Update Kahl Index Data

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 6 AM UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Python Setup & Script Execution ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install pandas requests

      - name: Run Python Ratings & Bracketology Scripts
        run: |
          python generate_ratings.py
          python generate_bracketology.py

      # --- 2. R Setup & Script Execution ---
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R Dependencies
        run: |
          install.packages(c("tidyverse", "jsonlite", "devtools"))
          devtools::install_github("sportsdataverse/softballR")
        shell: Rscript ${{ runner.os }}

      - name: Run Softball R Script
        run: Rscript calculate_rc7.R

      # --- 3. Commit All Generated Data Files ---
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ratings.json bracketology.json players.json
          git status
          git commit -m "Auto-update Kahl Index data (Ratings, Bracketology, Players)" || exit 0
          git push origin main
