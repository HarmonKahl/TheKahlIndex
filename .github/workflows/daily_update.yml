name: Update Kahl Index Data

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 6 AM UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Live NCAA Player Game Scraper
        run: python -u pull_player_stats.py 2026-02-05 2026-06-10

      - name: Calculate Player RC7 Metrics
        run: python calculate_rc7.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add player_games_season.csv _player_completed_dates.txt players.json qualified_players.json games_season.csv team_games_season.csv ratings.json bracketology.json || true
          git status
          git commit -m "Auto-update Kahl Index player game stats and RC7 metrics" || exit 0
          git push origin main
