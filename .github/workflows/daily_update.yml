name: 2026 NCAA D-I Softball RC7 & Kahl Index Pipeline

on:
  schedule:
    # Runs daily at 6:00 AM UTC (1:00 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Run full refresh (ignore saved CSVs and redo everything)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Step 1 - Pull Season Games, Teams & Player Box Scores
        run: |
          if [ "${{ github.event.inputs.full_refresh }}" == "true" ]; then
            python ncaa_pull.py --season 2026 --full-refresh
          else
            python ncaa_pull.py --season 2026
          fi

      - name: Step 2 - Generate Kahl Index, Bracketology & RC7 Leaderboards
        run: |
          python rc7.py --audit --season 2026

      - name: Commit and Push Updated Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f games_season.csv team_games_season.csv player_games_season.csv ratings.json bracketology.json players.json qualified_players.json _completed_dates.txt || true
          git commit -m "Auto-update 2026 Season Data, Ratings & RC7 Leaderboards [skip ci]" || exit 0
          git push

      - name: Upload Data Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-data-and-leaderboards
          path: |
            games_season.csv
            team_games_season.csv
            player_games_season.csv
            ratings.json
            bracketology.json
            players.json
            qualified_players.json
            _completed_dates.txt
